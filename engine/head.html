<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Lexend:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Layout: top bar with nav, then one content column; lectures use a side list + reading column. */
:root{
  --bg:#f2f4f7; --panel:#ffffff; --ink:#172230; --muted:#5b6878; --line:#d9dfe7;
  --accent:#0f6e73; --accent-ink:#ffffff; --soft:#dfeeee;
  --exam:#b4541a; --exam-bg:#fbe9dc; --hw:#5a4ab8; --hw-bg:#e6e2f7; --lec:#2f6fb0; --lec-bg:#dfeafb;
  --ok:#2d7a3e; --ok-bg:#dff1e1; --bad:#b03030; --bad-bg:#f8dede;
  --display:"Fraunces",Georgia,"Times New Roman",serif;
  --body:"IBM Plex Sans","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121820; --panel:#1b2330; --ink:#e7ecf2; --muted:#9aa7b8; --line:#2d3947;
  --accent:#4fb8bd; --accent-ink:#0b1418; --soft:#1e3537;
  --exam:#f0a26a; --exam-bg:#3d2a1c; --hw:#b3a6f5; --hw-bg:#2a2544; --lec:#8fbcf0; --lec-bg:#1d2d42;
  --ok:#7dd38f; --ok-bg:#1d3524; --bad:#f08a8a; --bad-bg:#44201f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121820; --panel:#1b2330; --ink:#e7ecf2; --muted:#9aa7b8; --line:#2d3947;
  --accent:#4fb8bd; --accent-ink:#0b1418; --soft:#1e3537;
  --exam:#f0a26a; --exam-bg:#3d2a1c; --hw:#b3a6f5; --hw-bg:#2a2544; --lec:#8fbcf0; --lec-bg:#1d2d42;
  --ok:#7dd38f; --ok-bg:#1d3524; --bad:#f08a8a; --bad-bg:#44201f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:14px 0 10px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand h1{font-family:var(--display);font-weight:600;font-size:1.25rem;margin:0;letter-spacing:-.01em}
.brand small{display:block;font-size:.72rem;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.brand svg{width:40px;height:40px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;font-size:.92rem}
nav.tabs a.on{background:var(--accent);color:var(--accent-ink)}
nav.tabs a:hover:not(.on){background:var(--soft);color:var(--ink)}
main{max-width:1120px;margin:0 auto;padding-top:22px}
h2{font-family:var(--display);font-weight:600;font-size:1.6rem;margin:0 0 6px;text-wrap:balance;letter-spacing:-.01em}
h3{font-family:var(--display);font-weight:600;font-size:1.2rem;margin:26px 0 8px;text-wrap:balance}
h4{font-size:.95rem;margin:16px 0 6px}
p{margin:0 0 .9em;max-width:70ch}
.eyebrow{font-family:var(--mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted);max-width:70ch}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.tag{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.03em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.tag.exam{background:var(--exam-bg);color:var(--exam)}
.tag.hw{background:var(--hw-bg);color:var(--hw)}
.tag.lec{background:var(--lec-bg);color:var(--lec)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.none{background:var(--soft);color:var(--muted)}
.tag.rec{background:var(--soft);color:var(--accent)}
.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.bar i.b2{background:var(--hw)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;border-radius:8px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.num{font-variant-numeric:tabular-nums;font-family:var(--mono)}
/* dashboard */
.stat{display:flex;gap:18px;align-items:center}
.ring{width:96px;height:96px;flex:none}
.lecrow{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lecrow:first-of-type{border-top:0}
.lecrow .bars{display:grid;gap:6px;grid-template-columns:1fr;min-width:0}
.lecrow .barline{display:grid;grid-template-columns:72px 1fr 64px;gap:8px;align-items:center;font-size:.8rem;color:var(--muted)}
.lecrow a{font-weight:500;text-decoration:none;color:var(--ink)}
.lecrow a:hover{color:var(--accent)}
/* lectures */
.lec-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px}
@media (max-width:760px){.lec-layout{grid-template-columns:minmax(0,1fr)}.leclist{min-width:0}}
.leclist{display:flex;flex-direction:column;gap:6px;position:sticky;top:84px;align-self:start}
@media (max-width:760px){.leclist{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.leclist button{text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;color:var(--ink);min-width:160px}
.leclist button.on{border-color:var(--accent);background:var(--soft)}
.leclist .t{font-weight:500;font-size:.9rem;display:block}
.leclist .bar{margin-top:6px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px}
.toc a{font-size:.82rem;text-decoration:none;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.toc a.done{border-color:var(--ok);color:var(--ok)}
.toc a:hover{color:var(--accent)}
section.sec{padding:8px 0 22px;border-bottom:1px solid var(--line)}
section.sec:last-of-type{border-bottom:0}
section.closing{background:var(--soft);border-radius:10px;padding:14px 18px 6px;margin-top:18px;border-bottom:0}
section.closing h3{margin-top:4px}
.secfoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.secfoot .btn.done{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
dfn{font-style:normal;font-weight:600;color:var(--accent);border-bottom:1px dotted var(--accent);cursor:pointer}
dfn.term:hover,dfn.term:focus-visible{background:var(--soft);border-radius:3px;outline:none}
.flash{animation:flash 2.2s ease}
@keyframes flash{0%,60%{background:var(--soft);box-shadow:0 0 0 6px var(--soft)}100%{background:transparent;box-shadow:none}}
.termpop .termt{font-weight:600;margin:4px 0 6px}
.termpop{max-width:min(380px,calc(100vw - 32px))}
.formula{background:var(--soft);border-radius:8px;padding:8px 14px;margin:8px 0 14px;overflow-x:auto}
.note{border-left:3px solid var(--exam);padding:4px 12px;color:var(--muted);font-size:.93rem;margin:10px 0}
.note.lec{border-color:var(--lec)}
.voice{background:var(--soft);border-radius:8px;padding:9px 14px 10px;margin:12px 0;max-width:70ch;font-size:.95rem}
.voice p:last-child{margin-bottom:0}
.voice .vlab{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.voice .vlab svg{width:13px;height:13px;flex:none}
.voice.hint{background:var(--exam-bg)}
.voice.hint .vlab{color:var(--exam)}
:root[data-voice="off"] .voice{display:none}
.recline{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.recline svg{width:13px;height:13px;vertical-align:-2px;margin-right:4px;color:var(--accent)}
ul,ol{max-width:70ch;padding-left:1.3em}
li{margin:.25em 0}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500}
.tablewrap{overflow-x:auto}
.defs{display:grid;gap:10px}
.def{display:grid;grid-template-columns:200px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line)}
@media (max-width:600px){.def{grid-template-columns:minmax(0,1fr);gap:4px}}
.def>*,.bankrow>*,.defs{min-width:0}
.def mjx-container:not([display="true"]),.bankrow mjx-container:not([display="true"]){display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.def b{font-weight:600}
.def .src{font-size:.78rem;color:var(--muted);font-family:var(--mono)}
input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
/* quiz */
.qsetup{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
.qsetup label{display:grid;gap:4px;font-size:.85rem;color:var(--muted)}
.qcard{max-width:760px}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.qprompt{font-size:1.02rem}
.opts{display:grid;gap:8px;margin:14px 0}
.opt{text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:8px}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.verdict{font-weight:600;margin-top:6px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.explain{margin-top:10px;padding:12px 14px;border-radius:8px;background:var(--soft)}
.qfoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.srcs{display:flex;gap:6px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:.85rem}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.weak{display:grid;gap:6px}
.weak a{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font-size:.9rem}
.weak a:hover{color:var(--accent)}
.bankrow{display:grid;grid-template-columns:130px minmax(0,1fr) 110px 90px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.92rem}
@media (max-width:700px){.bankrow{grid-template-columns:minmax(0,1fr) auto;gap:6px}.bankrow .q{grid-column:1/-1}}
.bankrow .ref{font-family:var(--mono);font-size:.8rem}
.cover{display:grid;grid-template-columns:140px 1fr 70px;gap:10px;align-items:center;font-size:.9rem;padding:6px 0}
textarea.io{width:100%;min-height:90px;font-family:var(--mono);font-size:.8rem}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:8px;font-size:.9rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20}
.toast.show{opacity:1}
mjx-container{overflow-x:auto;overflow-y:hidden;max-width:100%}
#lec{overflow-x:clip;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--line);border:1px solid var(--muted);vertical-align:middle;margin-right:8px;cursor:pointer;flex:none}
.dot.read{background:var(--exam);border-color:var(--exam)}
.dot.understood{background:var(--ok);border-color:var(--ok)}
.btn.lecstat{display:inline-flex;align-items:center;gap:4px}
.btn.lecstat.read{border-color:var(--exam)}.btn.lecstat.understood{border-color:var(--ok);background:var(--ok-bg)}
.toc{display:flex;flex-direction:column;gap:4px;margin:10px 0 18px;max-width:560px}
.toc a{display:flex;align-items:center;font-size:.9rem;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px}
.toc a:hover{border-color:var(--accent)}
.leclist{gap:4px}
.lecitem button{width:100%}
.lecitem.on button{border-color:var(--accent);background:var(--soft)}
.lecitem button .t{display:inline-block;margin-bottom:2px}
.lecitem button .hint{display:block}
.seclist{display:flex;flex-direction:column;gap:2px;padding:6px 0 8px 10px;border-left:2px solid var(--line);margin-left:12px}
.seclist a{display:flex;align-items:center;font-size:.8rem;color:var(--ink);text-decoration:none;padding:3px 4px;border-radius:6px}
.seclist a:hover{background:var(--soft)}
@media (max-width:760px){.lecitem{min-width:200px}.seclist{display:none}}
.secend{height:1px}
.secnav{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:20}
.secnav .lines{display:flex;flex-direction:column;gap:7px;align-items:flex-end;padding:8px 4px;cursor:pointer}
.secnav .lines i{display:block;width:18px;height:3px;border-radius:2px;background:var(--muted);opacity:.5}
.secnav .lines i.cur{width:28px;background:var(--accent);opacity:1}
.secnav .secpanel{display:none;position:absolute;right:0;top:50%;transform:translateY(-50%);width:min(300px,calc(100vw - 48px));background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:12px 14px}
.secnav:hover .secpanel,.secnav.open .secpanel{display:block}
.secnav:hover .lines,.secnav.open .lines{visibility:hidden}
.secnav .secpanel a{display:flex;align-items:center;font-size:.86rem;color:var(--ink);text-decoration:none;padding:5px 6px;border-radius:6px}
.secnav .secpanel a:hover,.secnav .secpanel a.cur{background:var(--soft)}
@media (max-width:760px){.secnav{display:none}}
.navfabs{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:30}
.fab.mini{position:static;width:40px;height:40px;font-size:1.1rem;background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.fab.mini:disabled{opacity:.4;cursor:default}
body{padding-bottom:140px}
figure.slide{cursor:zoom-in}
figure.slide:hover{border-color:var(--accent)}
.figmore{display:inline-block;margin-left:8px;font-family:var(--mono);font-size:.7rem;color:var(--accent)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px))}
.lbbox{position:relative;background:var(--panel);color:var(--ink);border-radius:12px;max-width:1100px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;padding:20px}
@media (max-width:820px){.lbbox{grid-template-columns:1fr}}
.lbimg img{width:100%;height:auto;border-radius:8px;background:#fff;border:1px solid var(--line)}
.lbtext{min-width:0;font-size:.95rem}
.lbtext h4{margin:14px 0 6px}
.lbcap{color:var(--muted);font-size:.9rem}
.lbclose{position:absolute;top:10px;right:10px}
</style>
<script>

 startup:{typeset:false,ready(){MathJax.startup.defaultReady();window.__mjReady=true;try{if(!document.getElementById('MJX-SVG-styles')){var st=MathJax.svgStylesheet();st.id='MJX-SVG-styles';document.head.appendChild(st)}}catch(e){}(window.IXDRAW||[]).slice().forEach(function(f){try{f()}catch(e){}});const v=document.getElementById('view');if(v)MathJax.typesetPromise([v]).then(function(){if(window.MARKS)MARKS.apply(v)}).catch(function(){});}}};

<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-svg.js"></script>

<header class="top">
  <a class="brand" href="#dashboard">
    {{LOGO_SVG}}
    <div><h1>{{TITLE}}</h1><small>{{SUBTITLE}}</small></div>
  </a>
  <nav class="tabs" id="nav">
    <a href="#dashboard" data-v="dashboard">Dashboard</a>
    <a href="#lectures" data-v="lectures">Lectures</a>
    <a href="#definitions" data-v="definitions">Definitions</a>
    <a href="#quiz" data-v="quiz">Quiz</a>
    <a href="#exam" data-v="exam">Exam bank</a>
  </nav>
</header>
<main id="view"></main>
<div class="toast" id="toast"></div>
<style>
figure.slide{margin:14px 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;max-width:720px}
figure.slide img{display:block;width:100%;height:auto;border-radius:6px;background:#fff}
figure.slide figcaption{margin-top:8px;font-size:.85rem;color:var(--muted);line-height:1.45}
.srctag{display:inline-block;font-family:var(--mono);font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;color:var(--lec);background:var(--lec-bg);padding:1px 7px;border-radius:999px;margin-right:8px;vertical-align:middle}
.ixbox{background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:16px 0;max-width:760px}
.ixtitle{font-weight:600;margin-bottom:8px}
.ixtitle::before{content:"◆ ";color:var(--accent)}
.ixctrl{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}
.ixctrl label{font-size:.85rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.ixctrl label b{color:var(--ink);font-family:var(--mono);font-weight:500}
.ixctrl input[type=range]{flex:1;min-width:120px;max-width:220px;accent-color:var(--accent)}
.ixctrl select{padding:4px 6px}
.ixgrid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:640px){.ixgrid{grid-template-columns:1fr}}
.ixsvg{width:100%;max-width:320px;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.ixread{font-size:.88rem;line-height:1.55;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
.ixread b{color:var(--accent)}
.ixread{overflow-x:auto}
.ixline{margin:3px 0}
.ixk{font-weight:600;color:var(--accent);margin-right:6px}
.ixread mjx-container,.ixctrl mjx-container{display:inline-block;vertical-align:middle;margin:0 1px}
.texpending{font-family:var(--mono);font-size:.85em;color:var(--muted)}
</style>
